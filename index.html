<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor & Controller Stik PS4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121214;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e1e24;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #00439c;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-btn {
      background-color: #00439c;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .status-btn:hover {
      background-color: #0056cc;
    }

    .info-section {
      background-color: #2a2a32;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .info-section h3 {
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #aaa;
      text-transform: uppercase;
    }

    /* Battery Bar */
    .battery-bar-bg {
      background-color: #444;
      height: 18px;
      border-radius: 9px;
      overflow: hidden;
      margin-top: 8px;
    }

    .battery-bar-fill {
      background-color: #4caf50;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease-in-out, background-color 0.3s;
    }

    /* Controls Grid */
    .color-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }

    /* Rumble Sliders */
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      font-size: 0.85rem;
    }

    .slider-group input {
      width: 100%;
      accent-color: #00439c;
    }

    /* Button Visualizer Grid */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .btn-badge {
      background-color: #1a1a1e;
      border: 1px solid #444;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #666;
      transition: all 0.1s;
    }

    .btn-badge.active {
      background-color: #0056cc;
      color: #fff;
      border-color: #0088ff;
      box-shadow: 0 0 10px rgba(0, 136, 255, 0.5);
    }

    .disabled {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>DS4 Control Center</h1>
    
    <button id="connectBtn" class="status-btn">Hubungkan Stik PS4</button>

    <div id="controls" class="disabled">
      <!-- Baterai -->
      <div class="info-section">
        <h3>Status Baterai</h3>
        <p id="batteryText">Menunggu data...</p>
        <div class="battery-bar-bg">
          <div id="batteryFill" class="battery-bar-fill"></div>
        </div>
      </div>

      <!-- Lightbar Color -->
      <div class="info-section color-section">
        <h3>Warna Lightbar</h3>
        <input type="color" id="colorPicker" value="#0000ff">
      </div>

      <!-- Rumble / Getar -->
      <div class="info-section">
        <h3>Tes Motor Getar (Rumble)</h3>
        <div class="slider-group">
          <label>Motor Kecil (High-frequency): <span id="smallMotorVal">0</span>%</label>
          <input type="range" id="smallMotor" min="0" max="255" value="0">
          
          <label>Motor Besar (Low-frequency): <span id="largeMotorVal">0</span>%</label>
          <input type="range" id="largeMotor" min="0" max="255" value="0">
        </div>
      </div>

      <!-- Reader Tombol -->
      <div class="info-section">
        <h3>Input Tombol</h3>
        <div class="button-grid">
          <div id="btn-square" class="btn-badge">□ (Square)</div>
          <div id="btn-cross" class="btn-badge">✕ (Cross)</div>
          <div id="btn-circle" class="btn-badge">◯ (Circle)</div>
          <div id="btn-triangle" class="btn-badge">△ (Triangle)</div>
          <div id="btn-l1" class="btn-badge">L1</div>
          <div id="btn-r1" class="btn-badge">R1</div>
          <div id="btn-l2" class="btn-badge">L2</div>
          <div id="btn-r2" class="btn-badge">R2</div>
          <div id="btn-share" class="btn-badge">Share</div>
          <div id="btn-options" class="btn-badge">Options</div>
          <div id="btn-l3" class="btn-badge">L3</div>
          <div id="btn-r3" class="btn-badge">R3</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let device;
    let currentColor = { r: 0, g: 0, b: 255 };
    let currentRumble = { small: 0, large: 0 };

    const connectBtn = document.getElementById('connectBtn');
    const controls = document.getElementById('controls');
    const batteryText = document.getElementById('batteryText');
    const batteryFill = document.getElementById('batteryFill');
    const colorPicker = document.getElementById('colorPicker');
    
    const smallMotor = document.getElementById('smallMotor');
    const largeMotor = document.getElementById('largeMotor');
    const smallMotorVal = document.getElementById('smallMotorVal');
    const largeMotorVal = document.getElementById('largeMotorVal');

    const SONY_VENDOR_ID = 0x054c;

    connectBtn.addEventListener('click', async () => {
      try {
        const devices = await navigator.hid.requestDevice({
          filters: [{ vendorId: SONY_VENDOR_ID }]
        });

        if (devices.length === 0) return;

        device = devices[0];
        await device.open();

        connectBtn.innerText = "Terhubung!";
        connectBtn.style.backgroundColor = "#4caf50";
        controls.classList.remove('disabled');

        // Kirim status awal LED
        sendOutputReport();

        // Listener data masuk dari stik
        device.addEventListener('inputreport', handleInputReport);

      } catch (error) {
        console.error("Gagal terhubung:", error);
        alert("Gagal terhubung ke Stik PS4. Pastikan menggunakan USB & Chrome/Edge.");
      }
    });

    // Membaca input data dari DS4
    function handleInputReport(event) {
      const { data } = event;

      // --- 1. PEMBACAAN BATERAI ---
      const batteryByte = data.getUint8(30);
      const capacity = Math.min(100, Math.round(((batteryByte & 0x0f) / 8) * 100));
      const isCharging = (batteryByte & 0x10) !== 0;

      batteryText.innerText = `${capacity}% ${isCharging ? '(Mengisi Daya ⚡)' : ''}`;
      batteryFill.style.width = `${capacity}%`;

      if (capacity <= 20) batteryFill.style.backgroundColor = '#f44336';
      else if (capacity <= 50) batteryFill.style.backgroundColor = '#ff9800';
      else batteryFill.style.backgroundColor = '#4caf50';

      // --- 2. PEMBACAAN TOMBOL (Bitwise Operations) ---
      const buttons1 = data.getUint8(5);
      const buttons2 = data.getUint8(6);

      // Byte 5 (Main Action Buttons)
      toggleBadge('btn-square', (buttons1 & 0x10) !== 0);
      toggleBadge('btn-cross', (buttons1 & 0x20) !== 0);
      toggleBadge('btn-circle', (buttons1 & 0x40) !== 0);
      toggleBadge('btn-triangle', (buttons1 & 0x80) !== 0);

      // Byte 6 (Shoulder, Special & Stick Clicks)
      toggleBadge('btn-l1', (buttons2 & 0x01) !== 0);
      toggleBadge('btn-r1', (buttons2 & 0x02) !== 0);
      toggleBadge('btn-l2', (buttons2 & 0x04) !== 0);
      toggleBadge('btn-r2', (buttons2 & 0x08) !== 0);
      toggleBadge('btn-share', (buttons2 & 0x10) !== 0);
      toggleBadge('btn-options', (buttons2 & 0x20) !== 0);
      toggleBadge('btn-l3', (buttons2 & 0x40) !== 0);
      toggleBadge('btn-r3', (buttons2 & 0x80) !== 0);
    }

    function toggleBadge(id, isActive) {
      const el = document.getElementById(id);
      if (isActive) el.classList.add('active');
      else el.classList.remove('active');
    }

    // Mengirim instruksi Output ke DS4 (LED + Getar)
    async function sendOutputReport() {
      if (!device || !device.opened) return;

      const reportData = new Uint8Array(31);
      
      reportData[0] = 0xff; // Enable LED & Rumble flags
      reportData[3] = currentRumble.small; // Motor getar kecil
      reportData[4] = currentRumble.large; // Motor getar besar
      reportData[5] = currentColor.r;      // Red
      reportData[6] = currentColor.g;      // Green
      reportData[7] = currentColor.b;      // Blue

      try {
        await device.sendReport(0x05, reportData);
      } catch (err) {
        console.error("Gagal mengirim perintah output:", err);
      }
    }

    // Event Pick Warna
    colorPicker.addEventListener('input', (e) => {
      const hex = e.target.value;
      currentColor.r = parseInt(hex.slice(1, 3), 16);
      currentColor.g = parseInt(hex.slice(3, 5), 16);
      currentColor.b = parseInt(hex.slice(5, 7), 16);
      sendOutputReport();
    });

    // Event Slider Rumble Motor
    smallMotor.addEventListener('input', (e) => {
      currentRumble.small = parseInt(e.target.value);
      smallMotorVal.innerText = Math.round((currentRumble.small / 255) * 100);
      sendOutputReport();
    });

    largeMotor.addEventListener('input', (e) => {
      currentRumble.large = parseInt(e.target.value);
      largeMotorVal.innerText = Math.round((currentRumble.large / 255) * 100);
      sendOutputReport();
    });
  </script>
</body>
</html>
